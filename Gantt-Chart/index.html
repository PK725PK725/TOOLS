<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="可離線使用、支援拖曳排程、搜尋篩選與安全匯入匯出的簡易甘特圖製作器">
  <title>簡易甘特圖製作器</title>
  <style>
    :root{
      --bg:#f4f8f8;--surface:#fff;--surface-2:#edf5f4;--ink:#123436;--muted:#607477;
      --line:#d5e3e2;--brand:#0d8278;--brand-dark:#08685f;--brand-soft:#dff4f1;
      --accent:#c94d12;--danger:#b42318;--today:#d92d20;--weekend:#f1f5f5;
      --focus:#27b7aa;--shadow:0 10px 28px rgba(18,52,54,.09);--row-h:48px;--head-h:80px;--period-h:30px
    }
    *{box-sizing:border-box}
    html{color-scheme:light;max-width:100%;overflow-x:hidden}
    body{width:100%;max-width:100%;margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif}
    button,input,select,textarea{font:inherit;color:inherit}
    button{border:0;cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.45}
    :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    .skip-link{position:fixed;left:12px;top:12px;z-index:100;transform:translateY(-160%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px}
    .skip-link:focus{transform:none}
    .app{width:100%;max-width:1680px;min-width:0;margin:auto;padding:22px}
    .app-heading{width:max-content;max-width:100%;margin:0 0 14px;font-family:"Arial Black","Microsoft JhengHei",sans-serif;font-size:clamp(30px,4vw,46px);line-height:1.15;font-weight:900;letter-spacing:.04em;background:linear-gradient(105deg,#4338ca 0%,#7c3aed 30%,#f9a8d4 47%,#fef3c7 52%,#7c3aed 68%,#1d4ed8 100%);background-size:220% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:heading-shine 22s linear infinite}
    @keyframes heading-shine{to{background-position:-220% 0}}
    .topbar{display:flex;min-width:0;max-width:100%;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:16px}
    .title-area{display:flex;gap:12px;align-items:center;min-width:0}
    .mark{width:46px;height:46px;flex:0 0 auto;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:850;font-size:20px}
    .project-title{width:min(440px,58vw);border:0;border-bottom:2px solid transparent;background:transparent;font-size:clamp(18px,2.4vw,25px);font-weight:850;padding:2px 4px}
    .project-title:hover,.project-title:focus{border-bottom-color:var(--brand);outline:none}
    .save-status{display:block;color:var(--muted);font-size:13px;margin:1px 0 0 4px}
    .actions,.view-controls,.filter-controls,.history-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .btn{min-height:44px;padding:9px 13px;border:1px solid transparent;border-radius:9px;background:#eaf2f1;color:var(--ink);font-weight:750;transition:background .18s,border-color .18s}
    .btn:hover{background:#dceae8}
    .btn.primary{background:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-dark)}
    .btn.danger{background:#fff0ef;color:var(--danger)}
    .btn.active,.btn[aria-pressed="true"]{background:var(--brand-soft);border-color:#84ccc4;color:var(--brand-dark)}
    .task-date-toggle[aria-pressed="true"]{background:#087443;color:#fff;border-color:#087443;box-shadow:0 2px 5px rgba(8,116,67,.28)}
    .workspace-size-toggle{background:#fff0d5;color:#9a3412;border-color:#f79009;box-shadow:0 2px 6px rgba(194,65,12,.18)}
    .workspace-size-toggle:hover{background:#ffdf9e;border-color:#ea580c}
    .workspace-size-toggle[aria-pressed="true"]{background:#7c3aed;color:#fff;border-color:#5b21b6;box-shadow:0 0 0 3px rgba(124,58,237,.22),0 4px 10px rgba(91,33,182,.34)}
    .workspace-size-toggle[aria-pressed="true"]:hover{background:#6d28d9}
    .btn.icon{min-width:44px;padding-inline:10px}
    .toolbar{width:100%;min-width:0;max-width:100%;background:var(--surface);padding:12px 14px;border:1px solid var(--line);border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .tool-left,.tool-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .segmented{display:flex;background:#edf3f2;padding:3px;border-radius:9px}
    .segmented button{min-height:38px;min-width:42px;padding:5px 11px;border-radius:7px;background:transparent;color:var(--muted);font-weight:750}
    .segmented button.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px #b8c7c7}
    .search{position:relative}
    .search input{width:210px;min-height:44px;padding:9px 36px 9px 11px;border:1px solid #b8c9c9;border-radius:9px;background:#fff}
    .search span{position:absolute;right:11px;top:10px;color:var(--muted);pointer-events:none}
    .filter-select{min-height:44px;padding:8px 34px 8px 10px;border:1px solid #b8c9c9;border-radius:9px;background:#fff}
    .mobile-scroll-hint{display:none;margin:0;padding:7px 12px;background:#fff8e9;color:#78520b;font-size:13px;border-inline:1px solid var(--line)}
    .board{display:grid;width:100%;max-width:100%;min-width:0;grid-template-columns:360px minmax(0,max-content);align-items:start;height:clamp(280px,calc(100vh - 410px),520px);height:clamp(280px,calc(100dvh - 410px),520px);background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;box-shadow:var(--shadow);overflow:auto;min-height:0;scrollbar-color:#9fb1b2 transparent;overscroll-behavior-x:contain;transition:height .22s ease}
    .board.workspace-expanded{height:clamp(520px,calc(100vh - 220px),900px);height:clamp(520px,calc(100dvh - 220px),900px)}
    .task-side{position:sticky;left:0;align-self:start;width:360px;min-width:360px;border-right:1px solid var(--line);background:#fff;z-index:10}
    .side-head{position:sticky;top:0;z-index:11;height:var(--head-h);border-bottom:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
    .side-period{height:var(--period-h);flex:0 0 var(--period-h);width:100%;padding:4px 14px;border-bottom:1px solid var(--line);background:#f5f9f8;color:var(--brand-dark);font-size:13px;font-weight:820}
    .side-task-head{flex:1;width:100%;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111;color:#fff}
    .side-task-head strong{font-size:15px;color:#ffd54f}.side-task-head span{font-size:12px;color:#e5e7eb;font-weight:650;text-align:right}
    .task-list{min-height:0}
    .task-row{height:var(--row-h);border-bottom:1px solid #e6eeee;padding:4px 5px;display:flex;align-items:center;gap:3px;background:#fff;color:#000;transition:background .15s,border-color .15s}
    .task-row:nth-child(even){background:#fff7dc;color:#653704}
    .task-row:hover{background:#eaf7f5}.task-row.selected{background:#dff4f1;box-shadow:inset 4px 0 0 var(--brand)}.task-row.drag-over{border-top:3px solid var(--brand)}
    .drag-grip{flex:0 0 14px;color:#849698;text-align:center;cursor:grab;user-select:none;font-weight:900;letter-spacing:-3px}
    .task-open{min-width:0;flex:1;text-align:left;padding:3px 2px;border-radius:6px;background:transparent}
    .task-name-line{display:flex;align-items:center;gap:6px;min-width:0}
    .task-name{font-weight:780;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .milestone-badge{flex:0 0 auto;font-size:11px;padding:1px 5px;border-radius:999px;background:#fff1e8;color:#9a3b0c;font-weight:800}
    .task-meta{display:block;margin-top:2px;color:#000;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.task-row:nth-child(even) .task-meta{color:#6a4c12}
    .progress-badge{flex:0 0 auto;border:1px solid #84ccc4;border-radius:999px;padding:2px 7px;font-size:12px;font-weight:850;white-space:nowrap;color:var(--brand-dark);background:var(--brand-soft)}
    .progress-badge.not-started,.progress-badge.complete{font-size:8px;padding:1px 5px}.progress-badge.not-started{color:#475467;background:#fff;border-color:#98a2b3}.progress-badge.complete{color:#fff;background:#087443;border-color:#087443}
    .empty{padding:30px 16px;color:var(--muted);text-align:center;white-space:pre-line}
    .timeline-wrap{width:max-content;min-width:0;min-height:0;overflow:visible;position:relative;background:#fff}
    .timeline{position:relative;min-width:100%}
    .timeline-head{height:var(--head-h);position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
    .period-head{height:var(--period-h);flex:0 0 var(--period-h);display:flex;background:#f5f9f8;border-bottom:1px solid var(--line)}
    .period-cell{height:var(--period-h);flex:0 0 var(--period-w);padding:4px 9px;border-right:1px solid var(--line);color:var(--brand-dark);font-size:13px;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .time-head-cells{flex:1;display:flex;min-height:0;background:#111}
    .time-cell{height:100%;min-width:0;flex:0 0 var(--cell-w);border-right:1px solid #3f4650;padding:6px 5px;text-align:center;font-size:12px;color:#fff;font-weight:720;overflow:hidden}
    .time-cell.weekend{background:#303846}.time-cell .top{display:block;color:#fff;font-size:13px;white-space:nowrap}
    .time-cell.compact{padding-inline:2px}.time-cell.compact .top{font-size:11px;letter-spacing:-.04em}.time-cell.partial{position:relative;z-index:2;overflow:visible}.time-cell.partial .top{position:absolute;top:6px;width:max-content;font-size:10px;letter-spacing:-.06em;overflow:visible}.time-cell.partial span:last-child{position:absolute;top:25px;width:max-content;font-size:10px}.time-cell.partial:first-child .top,.time-cell.partial:first-child span:last-child{left:2px}.time-cell.partial:last-child .top,.time-cell.partial:last-child span:last-child{right:2px;left:auto}
    .timeline-body{position:relative;min-height:calc(var(--row-h) * 1)}
    .timeline-row{height:var(--row-h);border-bottom:1px solid #e6eeee;position:relative;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--day-w) - 1px),#edf2f2 calc(var(--day-w) - 1px),#edf2f2 var(--day-w));background-size:auto 100%}
    div.timeline-row:nth-of-type(odd){background-color:#fff}div.timeline-row:nth-of-type(even){background-color:#fff7dc}
    .dependency-lines{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:1}
    .task-bar{position:absolute;top:6px;height:36px;min-width:18px;border:2px solid var(--bar);border-radius:7px;background:var(--bar);box-shadow:0 2px 5px rgba(10,70,67,.14);z-index:2;color:#fff;overflow:visible}
    .bar-core{position:absolute;inset:0;width:100%;padding:0 3px;border-radius:5px;background:transparent;color:#fff;overflow:hidden;touch-action:none;cursor:grab;text-align:left}
    .bar-core:active{cursor:grabbing}.bar-core:hover{background:rgba(255,255,255,.16)}
    .bar-done{position:absolute;inset:0 auto 0 0;width:var(--progress-w,var(--progress));background:rgba(255,255,255,.36);pointer-events:none}
    .task-bar.not-started .bar-done{display:none}
    .bar-core{display:flex;align-items:center}
    .bar-label{position:relative;z-index:1;display:block;flex:1 1 auto;min-width:0;max-width:none;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:850;letter-spacing:-.03em;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.22)}
    .bar-date-range{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);color:#000;font-size:13px;font-weight:700;line-height:1;white-space:nowrap;pointer-events:none;text-shadow:none}
    .featured-star{position:absolute;z-index:5;left:-20px;top:50%;display:grid;place-items:center;width:17px;height:17px;border:0;border-radius:50%;background:#6d28d9;color:#f8d34b;font-size:13px;line-height:1;text-shadow:0 0 4px rgba(248,211,75,.9);pointer-events:none;animation:featured-star-shine 3.6s ease-in-out infinite}
    @keyframes featured-star-shine{0%,100%{filter:brightness(1);opacity:.78;transform:translateY(-50%) scale(.9)}50%{filter:brightness(1.35);opacity:1;transform:translateY(-50%) scale(1.16)}}
    .resize-handle{position:absolute;z-index:3;top:0;width:7px;height:100%;padding:0;background:transparent;cursor:ew-resize;touch-action:none}
    .resize-handle.start{left:0}.resize-handle.end{right:0}
    .resize-handle::after{content:"";position:absolute;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--bar);box-shadow:0 0 0 1px rgba(255,255,255,.9);opacity:0}
    .resize-handle.start::after{left:2px}.resize-handle.end::after{right:2px}
    .task-bar:hover .resize-handle::after,.resize-handle:focus-visible::after{opacity:1}
    .task-bar.clip-start::before,.task-bar.clip-end::after{position:absolute;z-index:4;top:50%;transform:translateY(-50%);color:#fff;font-size:15px;font-weight:900;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.28);pointer-events:none}.task-bar.clip-start::before{content:"‹";left:4px}.task-bar.clip-end::after{content:"›";right:4px}.task-bar.clip-start .bar-label{padding-left:11px}.task-bar.clip-end .bar-label{padding-right:11px}
    .milestone{position:absolute;z-index:2;top:12px;width:24px;height:24px;border:2px solid var(--bar);border-radius:4px;background:linear-gradient(to right,var(--bar) var(--progress),var(--bar-soft) var(--progress));transform:rotate(45deg);box-shadow:0 2px 5px rgba(10,70,67,.2);touch-action:none}.milestone.not-started{background:var(--bar-soft)}.milestone.complete{background:var(--bar)}
    .milestone button{position:absolute;inset:-10px;background:transparent;transform:rotate(-45deg);cursor:grab}
    .drag-tip{position:fixed;z-index:50;display:none;transform:translate(-50%,-115%);background:var(--ink);color:#fff;border-radius:6px;padding:5px 8px;font-size:12px;font-weight:750;white-space:nowrap;pointer-events:none}
    .drag-tip.show{display:block}
    .today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:3;pointer-events:none}
    .today-line span{position:absolute;top:3px;left:4px;background:var(--today);color:#fff;border-radius:4px;padding:1px 4px;font-size:11px;white-space:nowrap}
    .legend{margin-top:13px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
    .print-notice{margin:10px 0 0;padding:8px 12px;border-left:5px solid #d92d20;border-radius:6px;background:#fff1f0;color:#b42318;font-size:14px;font-weight:850}
    .creator-credit{margin:1.15em 0 0;text-align:center;color:#546c6d;font-size:15px;font-weight:750;letter-spacing:.08em}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.dot.today{background:var(--today)}.dot.weekend{background:var(--weekend);border:1px solid var(--line)}
    .drawer{position:fixed;right:0;top:0;width:min(460px,100%);height:100dvh;background:#fff;box-shadow:-8px 0 28px rgba(12,39,40,.2);z-index:20;transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;padding:22px;overflow:auto}
    .drawer.open{transform:none;visibility:visible;transition-delay:0s}.scrim{position:fixed;inset:0;background:rgba(10,30,31,.5);z-index:19;opacity:0;visibility:hidden;transition:.2s}.scrim.show{opacity:1;visibility:visible}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.drawer h2{margin:0;font-size:22px}.close{width:44px;height:44px;border-radius:8px;background:#eef3f3;font-size:22px}
    .field{display:block;margin:13px 0}.field>span,.field legend{display:block;font-size:14px;font-weight:820;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;min-height:44px;padding:9px 10px;border:1px solid #aebfc0;border-radius:8px;background:#fff}.field textarea{min-height:86px;resize:vertical}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.range-line{display:flex;gap:10px;align-items:center}.range-line input{padding:0}.range-line output{min-width:42px;text-align:right;font-weight:850;color:var(--brand)}
    .check-line{display:flex;align-items:center;gap:9px;min-height:44px}.check-line input{width:20px;height:20px}
    details.advanced{margin:14px 0;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fbfdfd}details.advanced summary{cursor:pointer;font-weight:820;color:var(--brand-dark)}
    .form-error{min-height:24px;color:var(--danger);font-weight:750;font-size:14px}.drawer-actions{display:flex;gap:8px;justify-content:space-between;margin-top:16px}.drawer-actions .left,.drawer-actions .right{display:flex;gap:8px}
    dialog{width:min(620px,calc(100% - 28px));border:0;border-radius:14px;padding:0;color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.24)}dialog::backdrop{background:rgba(10,30,31,.52)}
    .dialog-card{padding:22px}.dialog-card h2{margin:0 0 8px;font-size:21px}.dialog-card p{color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .range-presets{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}.range-presets .btn{min-height:38px;padding:7px 10px;font-size:13px}.range-summary{min-height:22px;margin:10px 0 0;font-weight:720;color:var(--brand-dark)!important}
    .import-summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.summary-chip{padding:5px 9px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:750}.summary-chip.bad{background:#fff0ef;color:var(--danger)}
    .preview-wrap{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:8px}.preview-table{width:100%;border-collapse:collapse;font-size:13px}.preview-table th,.preview-table td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.preview-table th{position:sticky;top:0;background:#f3f8f7}
    .import-modes{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0}.import-modes label{display:flex;gap:7px;align-items:center}.error-list{max-height:100px;overflow:auto;color:var(--danger);font-size:13px}
    .toast{position:fixed;left:50%;bottom:20px;z-index:40;transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:12px 15px;border-radius:10px;box-shadow:var(--shadow);transition:transform .22s;display:flex;gap:14px;align-items:center}.toast.show{transform:translate(-50%,0)}.toast button{background:transparent;color:#a8f0e7;text-decoration:underline;font-weight:820;padding:2px}
    @media(max-width:1050px){.topbar{display:block}.actions{margin-top:12px}.board{grid-template-columns:310px minmax(0,max-content)}.task-side{width:310px;min-width:310px}.toolbar{align-items:flex-start;flex-direction:column}.tool-right{width:100%}.search{flex:1}.search input{width:100%}}
    @media(max-width:760px){.app{padding:12px}.project-title{width:calc(100vw - 92px)}.actions{gap:6px}.actions .btn{padding-inline:10px}.toolbar{padding:10px}.tool-left,.tool-right{width:100%}.history-controls{margin-left:auto}.mobile-scroll-hint{display:block}.board{grid-template-columns:205px minmax(0,max-content);height:clamp(260px,calc(100vh - 420px),440px);height:clamp(260px,calc(100dvh - 420px),440px);border-radius:0}.board.workspace-expanded{height:clamp(420px,calc(100vh - 160px),720px);height:clamp(420px,calc(100dvh - 160px),720px)}.task-side{width:205px;min-width:205px}.side-period,.side-task-head{padding-inline:10px}.task-row{padding-inline:5px}.drag-grip{display:none}.task-meta{font-size:10px}.legend{padding-inline:3px}.two-col{grid-template-columns:1fr}.drawer{padding:18px}.filter-select{flex:1}.search{order:2;flex-basis:100%}}
    @media(max-width:430px){.board{grid-template-columns:188px minmax(0,1fr)}.progress-badge{display:none}.side-head span{max-width:75px}.btn{font-size:14px}.segmented button{min-width:38px}.legend{font-size:12px}}
    @media print{body{background:#fff}.app{max-width:none;padding:0}.skip-link,.no-print,.drawer,.scrim,dialog,.toast,.legend,.mobile-scroll-hint{display:none!important}.topbar{margin-bottom:10px}.board{display:grid;height:auto;max-height:none;overflow:visible;box-shadow:none;border:1px solid #aaa;grid-template-columns:340px max-content}.task-side{position:static;width:340px;min-width:340px}.side-head,.timeline-head{position:static}.task-list,.timeline-wrap{width:auto;height:auto;overflow:visible}.timeline,.timeline-body,.timeline-row,.task-bar{overflow:visible!important}.task-bar{top:6px;height:36px}.today-line{display:none}.side-period,.period-cell{font-size:11px}.side-task-head strong{font-size:13px}.side-task-head span{font-size:10px}.time-cell{font-size:10px}.time-cell .top{font-size:11px}.task-name{font-size:14px}.task-meta{font-size:10px}.progress-badge{font-size:10px}.progress-badge.not-started,.progress-badge.complete{font-size:7px}.bar-label{font-size:10px}.bar-date-range{display:block!important;z-index:6;color:#000!important;font-size:11px;overflow:visible!important}.featured-star{transform:translateY(-50%) scale(.85)}
      /* 保留任務色與完成進度的底色：Chromium/Safari 與 Firefox 各自使用前綴與標準屬性。 */
      .task-bar,.milestone,.bar-done{-webkit-print-color-adjust:exact;print-color-adjust:exact;forced-color-adjust:none}
    }
    @page{size:landscape;margin:8mm}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <a class="skip-link" href="#ganttBoard">跳到甘特圖</a>
  <main class="app">
    <h1 class="app-heading">簡易甘特圖製作程式</h1>
    <header class="topbar">
      <div class="title-area">
        <div class="mark" aria-hidden="true">G</div>
        <div><input id="projectName" class="project-title" aria-label="專案名稱" value="我的甘特圖"><span id="saveStatus" class="save-status" aria-live="polite">正在載入…</span></div>
      </div>
      <div class="actions no-print">
        <button class="btn" id="importBtn">匯入備份</button><button class="btn" id="exportBtn">匯出備份</button>
        <button class="btn" id="csvImportBtn">匯入 CSV</button><button class="btn" id="csvBtn">匯出 CSV</button><button class="btn" id="pdfBtn">輸出 PDF</button><button class="btn" id="pngBtn">輸出 PNG</button>
        <button class="btn" id="printBtn">列印</button><button class="btn primary" id="addBtn">新增任務</button><button class="btn danger" id="clearAllBtn">清除所有任務</button>
        <input id="fileInput" type="file" accept="application/json,.json" hidden><input id="csvFileInput" type="file" accept="text/csv,.csv" hidden>
      </div>
    </header>
    <section class="toolbar no-print" aria-label="甘特圖工具列">
      <div class="tool-left">
        <div class="segmented" role="group" aria-label="時間檢視"><button data-view="day" title="切換為每日時間刻度">日</button><button data-view="week" title="切換為每週時間刻度">週</button><button data-view="month" title="切換為每月時間刻度">月</button></div>
        <button class="btn" id="todayBtn" title="將時間軸移動到今天所在位置">回到今天</button>
        <div class="view-controls" role="group" aria-label="時間軸縮放"><button class="btn icon" id="zoomOutBtn" aria-label="縮小時間軸" title="縮小時間軸，顯示更長的日期範圍">－</button><button class="btn" id="fitBtn" title="自動縮放，使全部任務日期範圍符合畫面寬度">全圖</button><button class="btn icon" id="zoomInBtn" aria-label="放大時間軸" title="放大時間軸，查看更細的日期範圍">＋</button></div>
        <button class="btn task-date-toggle" id="taskDateBtn" aria-pressed="true" title="切換是否在進度條旁顯示任務日期">顯示任務日期</button><button class="btn" id="rangeBtn" aria-pressed="false" title="限制甘特圖目前顯示的開始與結束日期">目前顯示範圍</button><button class="btn" id="advancedBtn" aria-pressed="false" title="切換是否顯示負責人與前置任務等進階資訊">進階資訊</button><button class="btn workspace-size-toggle" id="workspaceSizeBtn" aria-controls="ganttBoard" aria-pressed="false" title="增加甘特圖高度，方便瀏覽大量任務">↕ 展開工作區</button>
      </div>
      <div class="tool-right">
        <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜尋任務、備註或負責人" aria-label="搜尋任務"></label>
        <select id="filterSelect" class="filter-select" aria-label="篩選任務"><option value="all">全部任務</option><option value="remaining">未完成</option><option value="overdue">已逾期</option><option value="milestone">里程碑</option></select>
        <div class="history-controls" role="group" aria-label="編輯紀錄"><button class="btn icon" id="undoBtn" aria-label="復原" title="復原（Ctrl+Z）">↶</button><button class="btn icon" id="redoBtn" aria-label="重做" title="重做（Ctrl+Y）">↷</button></div>
      </div>
    </section>
    <p class="mobile-scroll-hint no-print">提示：右側時間軸可左右滑動；按住任務長條可移動日期。</p>
    <section class="board" id="ganttBoard" aria-label="甘特圖" title="提示：底部的水平捲軸可左右拖曳，瀏覽完整時間軸。">
      <div class="task-side"><div class="side-head"><div class="side-period" id="periodLabel">月份</div><div class="side-task-head"><strong>任務與日期</strong><span id="taskCount">0 個任務</span></div></div><div id="taskList" class="task-list"></div></div>
      <div class="timeline-wrap" id="timelineWrap" tabindex="0" aria-label="可水平捲動的時間軸"><div class="timeline" id="timeline"></div></div>
    </section>
    <div class="legend"><span><i class="dot today"></i>今天</span><span><i class="dot weekend"></i>週末</span><span>實心色表示已完成，淺色表示未完成</span><span>拖曳長條移動日期；左右端調整範圍；Alt＋方向鍵也可移動</span></div>
    <p class="print-notice no-print">列印時，務必開啟「列印背景圖形」選項，甘特圖的進度條才會顯示顏色。</p>
    <footer class="creator-credit">彭榮生 製作</footer>
  </main>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="任務編輯面板" aria-hidden="true" inert>
    <div class="drawer-head"><h2 id="drawerTitle">新增任務</h2><button class="close" id="closeDrawer" aria-label="關閉編輯面板">×</button></div>
    <form id="taskForm" novalidate>
      <label class="field"><span>任務名稱</span><input id="taskName" required maxlength="100" placeholder="例如：整理報告內容"></label>
      <div class="two-col"><label class="field"><span>開始日期</span><input id="startDate" type="date" required></label><label class="field"><span>結束日期</span><input id="endDate" type="date" required></label></div>
      <label class="field"><span>完成進度</span><div class="range-line"><input id="progress" type="range" min="0" max="100" value="0"><output id="progressOutput">0%</output></div></label>
      <label class="field"><span>顏色</span><select id="color">
        <option value="random">隨機顏色（相鄰不重複）</option>
        <option value="#0d8278">青綠</option><option value="#047857">翠綠</option><option value="#15803d">綠色</option><option value="#0e7490">深青</option>
        <option value="#0369a1">天空藍</option><option value="#2563eb">藍色</option><option value="#4338ca">靛藍</option><option value="#7c3aed">紫色</option>
        <option value="#a21caf">洋紅</option><option value="#be185d">玫紅</option><option value="#db2777">粉紅</option><option value="#b42318">紅色</option>
        <option value="#c2410c">橘色</option><option value="#b45309">琥珀</option><option value="#92400e">棕色</option><option value="#475467">灰色</option>
      </select></label>
      <label class="field"><span>備註（選填）</span><textarea id="notes" maxlength="1000" placeholder="可記錄提醒、成果或工作內容"></textarea></label>
      <details class="advanced" id="advancedFields"><summary>進階資訊</summary>
        <label class="field"><span>負責人（選填）</span><input id="assignee" maxlength="60" placeholder="例如：王小明"></label>
        <label class="field"><span>前置任務（選填）</span><select id="dependsOn"><option value="">無</option></select></label>
        <label class="check-line"><input id="milestone" type="checkbox"><span>設為里程碑（只使用開始日期）</span></label>
      </details>
      <label class="check-line"><input id="featured" type="checkbox"><span>重點項目 (任務進度條前 增加 星號)</span></label>
      <p id="formError" class="form-error" role="alert"></p>
      <div class="drawer-actions"><div class="left"><button type="button" class="btn danger" id="deleteBtn">刪除任務</button><button type="button" class="btn" id="copyBtn">複製任務</button></div><div class="right"><button type="button" class="btn" id="cancelBtn">取消</button><button class="btn primary" type="submit">儲存任務</button></div></div>
    </form>
  </aside>
  <dialog id="confirmDialog"><div class="dialog-card"><h2 id="confirmTitle">確認操作</h2><p id="confirmText"></p><div class="dialog-actions"><button class="btn" id="confirmCancel">取消</button><button class="btn danger" id="confirmOk">確定</button></div></div></dialog>
  <dialog id="rangeDialog"><div class="dialog-card"><h2>目前顯示範圍</h2><p>只顯示與此日期範圍有交集的任務；任務原始日期不會被修改，輸出 PDF、PNG 與「全圖」也會套用此範圍。</p><div class="two-col"><label>開始日期<input id="rangeStart" type="date"></label><label>結束日期<input id="rangeEnd" type="date"></label></div><div class="range-presets" aria-label="日期範圍快速選擇"><button type="button" class="btn" data-range-preset="tasks">全部任務範圍</button><button type="button" class="btn" data-range-preset="month">本月</button><button type="button" class="btn" data-range-preset="quarter">本季</button><button type="button" class="btn" data-range-preset="next30">未來 30 天</button></div><p class="range-summary" id="rangeSummary" aria-live="polite"></p><p class="form-error" id="rangeError"></p><div class="dialog-actions"><button class="btn" id="rangeClear">取消日期限制</button><button class="btn" id="rangeCancel">取消</button><button class="btn primary" id="rangeApply">套用範圍</button></div></div></dialog>
  <dialog id="csvDialog"><div class="dialog-card"><h2>匯入 CSV 預覽</h2><p>請先確認資料，再選擇加入或取代目前任務。</p><div id="importSummary" class="import-summary"></div><div id="csvPreview" class="preview-wrap"></div><div id="csvErrors" class="error-list"></div><div class="import-modes"><label><input type="radio" name="importMode" value="append" checked>加入目前專案</label><label><input type="radio" name="importMode" value="replace">取代目前任務</label></div><div class="dialog-actions"><button class="btn" id="csvCancel">取消</button><button class="btn primary" id="csvApply">匯入有效資料</button></div></div></dialog>
  <div class="drag-tip" id="dragTip" role="status"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastUndo" hidden>復原</button></div>
  <script>
  (()=>{
    'use strict';
    const KEY='simple-gantt-zh-hant-v2',OLD_KEY='simple-gantt-zh-hant-v1',MAX_HISTORY=60,IMPORT_COLORS=['#0d8278','#047857','#15803d','#0e7490','#0369a1','#2563eb','#4338ca','#7c3aed','#a21caf','#be185d','#c2410c','#b45309','#ca8a04','#4d7c0f','#475569','#b91c1c'];
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const els={name:$('#projectName'),status:$('#saveStatus'),board:$('#ganttBoard'),workspaceSize:$('#workspaceSizeBtn'),list:$('#taskList'),count:$('#taskCount'),periodLabel:$('#periodLabel'),timeline:$('#timeline'),wrap:$('#timelineWrap'),drawer:$('#drawer'),scrim:$('#scrim'),form:$('#taskForm'),drawerTitle:$('#drawerTitle'),taskName:$('#taskName'),start:$('#startDate'),end:$('#endDate'),progress:$('#progress'),progressOut:$('#progressOutput'),color:$('#color'),notes:$('#notes'),assignee:$('#assignee'),depends:$('#dependsOn'),milestone:$('#milestone'),featured:$('#featured'),advancedFields:$('#advancedFields'),error:$('#formError'),del:$('#deleteBtn'),copy:$('#copyBtn'),search:$('#searchInput'),filter:$('#filterSelect'),undo:$('#undoBtn'),redo:$('#redoBtn'),taskDateBtn:$('#taskDateBtn'),rangeBtn:$('#rangeBtn'),rangeDialog:$('#rangeDialog'),rangeStart:$('#rangeStart'),rangeEnd:$('#rangeEnd'),rangeSummary:$('#rangeSummary'),rangeError:$('#rangeError'),advanced:$('#advancedBtn'),file:$('#fileInput'),csvFile:$('#csvFileInput'),confirm:$('#confirmDialog'),csvDialog:$('#csvDialog'),toast:$('#toast'),toastText:$('#toastText'),toastUndo:$('#toastUndo'),tip:$('#dragTip')};
    const pad=n=>String(n).padStart(2,'0');
    const localISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const fromISO=s=>new Date(`${s}T00:00:00Z`);
    const isoUTC=d=>d.toISOString().slice(0,10);
    const addDays=(s,n)=>{const d=fromISO(s);d.setUTCDate(d.getUTCDate()+n);return isoUTC(d)};
    const daysBetween=(a,b)=>Math.round((fromISO(b)-fromISO(a))/86400000);
    const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
    const rowHeight=()=>Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row-h'))||56;
    const ROW_H=rowHeight();
    const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(fromISO(s).getTime());
    function normalizeImportDate(value){const match=String(value||'').trim().match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})$/);if(!match)return '';const [,year,month,day]=match,date=`${year}-${pad(month)}-${pad(day)}`,parsed=fromISO(date);return validDate(date)&&parsed.getUTCFullYear()===+year&&parsed.getUTCMonth()+1===+month&&parsed.getUTCDate()===+day?date:''}
    const newId=()=>`task-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    const escFile=s=>(s||'甘特圖').replace(/[\\/:*?"<>|]/g,'_').trim()||'甘特圖';
    const stamp=()=>{const d=new Date();return `${localISO(d)}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`};
    const duration=t=>t.milestone?0:daysBetween(t.start,t.end)+1;
    const shortDate=s=>{const d=fromISO(s);return `${d.getUTCMonth()+1}/${d.getUTCDate()}`};
    const progressState=p=>p<=0?{className:'not-started',short:'○ 未開始',full:'未開始'}:p>=100?{className:'complete',short:'✓ 已完成',full:'已完成'}:{className:'in-progress',short:`${p}%`,full:`進行中 ${p}%`};
    function taskDetails(t){const status=progressState(t.progress),dependsOn=state.tasks.find(x=>x.id===t.dependsOn),lines=[`任務：${t.name}`,t.milestone?`日期：${t.start}（里程碑）`:`開始：${t.start}`,t.milestone?'':`結束：${t.end}`,t.milestone?'':`工期：${duration(t)} 天`,`進度：${t.progress}%（${status.full}）`,t.assignee?`負責人：${t.assignee}`:'',dependsOn?`前置任務：${dependsOn.name}`:'',t.notes?`備註：${t.notes}`:''];return lines.filter(Boolean).join('\n')}
    function paleColor(hex,whiteRatio=.84){const value=String(hex||'').replace('#','');if(!/^[0-9a-f]{6}$/i.test(value))return '#eef4f3';const rgb=[0,2,4].map(i=>parseInt(value.slice(i,i+2),16)),mixed=rgb.map(v=>Math.round(v*(1-whiteRatio)+255*whiteRatio));return `#${mixed.map(v=>v.toString(16).padStart(2,'0')).join('')}`}
    function defaults(){const t=localISO();return {schemaVersion:4,project:{name:'我的甘特圖',view:'week',zoom:0,fit:false,showAdvanced:false,showTaskDates:true,visualRange:{enabled:false,start:'',end:''}},tasks:[
      {id:newId(),name:'規劃工作內容',start:addDays(t,-4),end:addDays(t,1),progress:100,color:'#0d8278',notes:'',assignee:'',milestone:false,dependsOn:''},
      {id:newId(),name:'蒐集與整理資料',start:addDays(t,-1),end:addDays(t,5),progress:60,color:'#2563eb',notes:'',assignee:'',milestone:false,dependsOn:''},
      {id:newId(),name:'製作主要內容',start:addDays(t,3),end:addDays(t,11),progress:25,color:'#7c3aed',notes:'',assignee:'',milestone:false,featured:true,dependsOn:''},
      {id:newId(),name:'檢查與完成',start:addDays(t,10),end:addDays(t,14),progress:0,color:'#c2410c',notes:'',assignee:'',milestone:false,dependsOn:''}
    ]}}
    function migrate(data){
      if(!data||!data.project||!Array.isArray(data.tasks))return null;
      const fallback=localISO(),sourceVersion=Number(data.schemaVersion)||0;
      const tasks=data.tasks.map((t,i)=>{const start=validDate(t.start)?t.start:fallback;let end=validDate(t.end)?t.end:start;if(end<start)end=start;const isOldDefaultFeatured=sourceVersion<4&&t.name==='製作主要內容'&&t.color==='#7c3aed'&&Number(t.progress)===25&&daysBetween(start,end)===8;return {id:typeof t.id==='string'&&t.id?t.id:`legacy-${Date.now()}-${i}`,name:String(t.name||`未命名任務 ${i+1}`).slice(0,100),start,end,progress:clamp(Number(t.progress)||0,0,100),color:/^#[0-9a-f]{6}$/i.test(t.color||'')?t.color:'#0d8278',notes:String(t.notes||'').slice(0,1000),assignee:String(t.assignee||'').slice(0,60),milestone:Boolean(t.milestone),featured:Boolean(t.featured)||isOldDefaultFeatured,dependsOn:typeof t.dependsOn==='string'?t.dependsOn:''}});
      const ids=new Set(tasks.map(t=>t.id));tasks.forEach(t=>{if(!ids.has(t.dependsOn)||t.dependsOn===t.id)t.dependsOn='';if(t.milestone)t.end=t.start});
      const savedRange=data.project.visualRange||{},rangeValid=Boolean(savedRange.enabled&&validDate(savedRange.start)&&validDate(savedRange.end)&&savedRange.start<=savedRange.end);
      return {schemaVersion:4,project:{name:String(data.project.name||'未命名專案').slice(0,100),view:['day','week','month'].includes(data.project.view)?data.project.view:'week',zoom:clamp(Number(data.project.zoom)||0,-3,6),fit:Boolean(data.project.fit),showAdvanced:Boolean(data.project.showAdvanced),showTaskDates:data.project.showTaskDates!==false,visualRange:{enabled:rangeValid,start:rangeValid?savedRange.start:'',end:rangeValid?savedRange.end:''}},tasks};
    }
    function load(){for(const key of [KEY,OLD_KEY]){try{const value=localStorage.getItem(key);if(value){const next=migrate(JSON.parse(value));if(next)return next}}catch{}}return defaults()}
    let state=load(),editingId=null,lastFocus=null,undoStack=[],redoStack=[],toastTimer=null,pendingImport=null,confirmAction=null,forcedRange=null,printingPDF=false,printTitle='',fitActual=false,resetTimelinePosition=false;
    const ui={query:'',filter:'all'};
    function snapshot(){return JSON.stringify(state)}
    function persist(label='已自動儲存'){try{localStorage.setItem(KEY,JSON.stringify(state));els.status.textContent=`${label}・${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}`}catch{els.status.textContent='無法儲存：瀏覽器儲存空間不可用'}}
    function commit(label,mutator,{toast=true}={}){undoStack.push(snapshot());if(undoStack.length>MAX_HISTORY)undoStack.shift();redoStack=[];mutator();persist();render();if(toast)showToast(label,true)}
    function restoreFrom(stack,target,label){if(!stack.length)return;target.push(snapshot());state=migrate(JSON.parse(stack.pop()));persist(label);render();showToast(label,false)}
    function undo(){restoreFrom(undoStack,redoStack,'已復原')}
    function redo(){restoreFrom(redoStack,undoStack,'已重做')}
    function showToast(text,canUndo=false){clearTimeout(toastTimer);els.toastText.textContent=text;els.toastUndo.hidden=!canUndo;els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),6000)}
    function currentVisualRange(){const r=state.project.visualRange;return r?.enabled&&validDate(r.start)&&validDate(r.end)&&r.start<=r.end?{start:r.start,end:r.end}:null}
    function taskIntersectsRange(t,r){return !r||t.start<=r.end&&t.end>=r.start}
    function filteredTasks(){const q=ui.query.trim().toLocaleLowerCase('zh-Hant'),today=localISO();return state.tasks.filter(t=>{const text=`${t.name} ${t.notes} ${t.assignee}`.toLocaleLowerCase('zh-Hant');if(q&&!text.includes(q))return false;if(ui.filter==='remaining'&&t.progress>=100)return false;if(ui.filter==='overdue'&&!(t.end<today&&t.progress<100))return false;if(ui.filter==='milestone'&&!t.milestone)return false;return true})}
    function visibleTasks(){const range=currentVisualRange();return filteredTasks().filter(t=>taskIntersectsRange(t,range))}
    function actualTaskRange(tasks=state.tasks){if(!tasks.length){const today=localISO();return {start:today,end:today}}return tasks.reduce((range,t)=>({start:t.start<range.start?t.start:range.start,end:t.end>range.end?t.end:range.end}),{start:tasks[0].start,end:tasks[0].end})}
    function render(){
      const scroll={top:els.board.scrollTop,left:els.board.scrollLeft};
      if(document.activeElement!==els.name)els.name.value=state.project.name;
      $$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.project.view));
      els.advanced.setAttribute('aria-pressed',String(state.project.showAdvanced));els.taskDateBtn.setAttribute('aria-pressed',String(state.project.showTaskDates));els.taskDateBtn.title=state.project.showTaskDates?'隱藏任務日期區間':'顯示任務日期區間';
      els.advanced.classList.toggle('active',state.project.showAdvanced);els.undo.disabled=!undoStack.length;els.redo.disabled=!redoStack.length;
      const range=currentVisualRange();els.rangeBtn.setAttribute('aria-pressed',String(Boolean(range)));els.rangeBtn.classList.toggle('active',Boolean(range));els.rangeBtn.title=range?`目前顯示範圍：${range.start} 至 ${range.end}`:'設定目前顯示的日期範圍';
      els.periodLabel.textContent=state.project.view==='month'?'年份':'月份';
      const tasks=visibleTasks();els.count.textContent=tasks.length===state.tasks.length?`${tasks.length} 個任務`:`顯示 ${tasks.length}／${state.tasks.length}`;renderList(tasks);renderTimeline(tasks);requestAnimationFrame(()=>{els.board.scrollTop=scroll.top;els.board.scrollLeft=resetTimelinePosition?0:scroll.left;resetTimelinePosition=false;verifyRowAlignment(tasks)})
    }
    function verifyRowAlignment(tasks){const left=[...els.list.querySelectorAll('.task-row')],right=[...els.timeline.querySelectorAll('.timeline-row')];const aligned=left.length===tasks.length&&right.length===tasks.length&&left.every((row,i)=>row.dataset.id===right[i]?.dataset.id&&Math.abs(row.getBoundingClientRect().top-right[i].getBoundingClientRect().top)<=1);els.board.dataset.rowAlignment=aligned?'ok':'check'}
    function renderList(tasks){
      els.list.replaceChildren();
      if(!tasks.length){const e=document.createElement('div');e.className='empty';e.textContent=state.tasks.length?'沒有符合條件的任務。':'尚未建立任務。\n按「新增任務」開始吧！';els.list.append(e);return}
      tasks.forEach(t=>{
        const details=taskDetails(t),row=document.createElement('div');row.className=`task-row${editingId===t.id?' selected':''}`;row.draggable=true;row.tabIndex=0;row.dataset.id=t.id;row.title=details;row.setAttribute('aria-label',`${t.name}，${t.start} 至 ${t.end}。按 Alt 加上下方向鍵可排序`);
