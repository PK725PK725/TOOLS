  <script>
    (() => {
      'use strict';

      const screen = document.getElementById('lock-screen');
      const form = document.getElementById('unlock-form');
      const password = document.getElementById('tool-password');
      const button = document.getElementById('unlock-button');
      const status = document.getElementById('unlock-status');
      const payload = document.getElementById('encrypted-tool');
      const subtle = globalThis.crypto?.subtle;

      function showStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle('error', isError);
      }

      function decodeBase64(value) {
        return Uint8Array.from(atob(value), character => character.charCodeAt(0));
      }

      if (!subtle) {
        password.disabled = true;
        showStatus('此環境無法解密。請將檔案下載後，以支援 Web Crypto 的瀏覽器直接開啟。', true);
        return;
      }

      let encryptedTool;
      try {
        const { iterations, salt, iv, ciphertext } = JSON.parse(payload.textContent);
        encryptedTool = {
          iterations,
          salt: decodeBase64(salt),
          iv: decodeBase64(iv),
          ciphertext: decodeBase64(ciphertext)
        };
      } catch {
        password.disabled = true;
        showStatus('加密資料無法讀取。請重新取得完整檔案。', true);
        return;
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (button.disabled || !password.value) return;

        button.disabled = true;
        password.disabled = true;
        password.removeAttribute('aria-invalid');
        showStatus('正在解密…');
        const inputBytes = new TextEncoder().encode(password.value);
        password.value = '';

        let plaintext;
        try {
          const material = await subtle.importKey('raw', inputBytes, 'PBKDF2', false, ['deriveKey']);
          const key = await subtle.deriveKey(
            { name: 'PBKDF2', hash: 'SHA-256', salt: encryptedTool.salt, iterations: encryptedTool.iterations },
            material,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
          );
          plaintext = await subtle.decrypt(
            { name: 'AES-GCM', iv: encryptedTool.iv, tagLength: 128 },
            key,
            encryptedTool.ciphertext
          );
        } catch {
          showStatus('無法解鎖。請確認密碼正確、檔案完整，再試一次。', true);
          password.setAttribute('aria-invalid', 'true');
          password.disabled = false;
          button.disabled = false;
          password.focus();
          return;
        } finally {
          inputBytes.fill(0);
        }

        const tool = document.createElement('iframe');
        tool.title = '圖片批次去浮水印工具';
        // 以獨立文件載入原工具，讓原有樣式與程式正常初始化。
        tool.srcdoc = new TextDecoder('utf-8', { fatal: true }).decode(plaintext);
        screen.replaceWith(tool);
        tool.focus();
      });

      button.disabled = false;
    })();
  </script>
